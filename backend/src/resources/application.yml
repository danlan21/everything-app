spring:
  application:
    name: everything

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  config:
    import: optional:file:../.env[.properties]
  flyway:
    enabled: true

management:
  endpoints:
    web:
      base-path: /api/actuator
  endpoint:
    health:
      probes:
        enabled: true